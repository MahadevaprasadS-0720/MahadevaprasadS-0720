name: Update README Projects

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update README with latest projects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-readme.js

      - name: Commit changes
        run: |
          git config user.name "MahadevaprasadS-0720"
          git config user.email "MahadevaprasadS-0720@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: auto-update projects list" && git push)
